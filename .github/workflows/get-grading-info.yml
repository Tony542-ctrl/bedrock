name: "Retrieve Grading Info"

on:
  workflow_dispatch:

jobs:
  retrieve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Fetch dev-view credentials
        run: |
          echo "================================================="
          echo "BEDROCK-DEV-VIEW CREDENTIALS"
          echo "================================================="
          echo "Access Key ID: $(terraform output -raw dev_view_access_key_id)"
          echo "Secret Access Key: $(terraform output -raw dev_view_secret_access_key)"
          echo "Console Password: $(terraform output -raw dev_view_console_password)"
          echo "================================================="
        working-directory: terraform

      - name: Fetch ALB Ingress URL
        run: |
          aws eks update-kubeconfig --name project-bedrock-cluster --region us-east-1
          echo "================================================="
          echo "STORE URL (ALB INGRESS)"
          echo "================================================="
          kubectl get ingress -n retail-app
          echo "================================================="
          echo ""
          echo "ALL PODS STATUS:"
          kubectl get pods -n retail-app
          echo "================================================="
          echo ""
          echo "ALL SERVICES:"
          kubectl get svc -n retail-app
          echo "================================================="

      - name: Build safe grading.json (no secrets)
        working-directory: terraform
        run: |
          # Build grading.json with only non-sensitive outputs
          # This avoids GitHub Push Protection blocking the commit
          cat > ../grading.json << 'JSONEOF'
          {
          JSONEOF

          # Extract each non-sensitive output individually
          echo "  \"cluster_endpoint\": { \"value\": \"$(terraform output -raw cluster_endpoint)\" }," >> ../grading.json
          echo "  \"cluster_name\": { \"value\": \"$(terraform output -raw cluster_name)\" }," >> ../grading.json
          echo "  \"region\": { \"value\": \"$(terraform output -raw region)\" }," >> ../grading.json
          echo "  \"vpc_id\": { \"value\": \"$(terraform output -raw vpc_id)\" }," >> ../grading.json
          echo "  \"assets_bucket_name\": { \"value\": \"$(terraform output -raw assets_bucket_name)\" }," >> ../grading.json
          echo "  \"catalog_db_endpoint\": { \"value\": \"$(terraform output -raw catalog_db_endpoint)\" }," >> ../grading.json
          echo "  \"orders_db_endpoint\": { \"value\": \"$(terraform output -raw orders_db_endpoint)\" }," >> ../grading.json
          echo "  \"alb_controller_role_arn\": { \"value\": \"$(terraform output -raw alb_controller_role_arn)\" }," >> ../grading.json
          echo "  \"carts_irsa_role_arn\": { \"value\": \"$(terraform output -raw carts_irsa_role_arn)\" }" >> ../grading.json

          echo "}" >> ../grading.json

          echo "=== grading.json contents ==="
          cat ../grading.json

      - name: Commit and push grading.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grading.json
          if git diff --cached --quiet; then
            echo "grading.json unchanged, skipping commit"
          else
            git commit -m "chore: update grading.json for submission"
            git push
          fi
